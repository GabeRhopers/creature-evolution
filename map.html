<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Map · Creature Evolution</title>
    <link href="fonts/fonts.css" rel="stylesheet" />
    <link rel="icon" href="icons/icon-192.png" />
    <meta name="theme-color" content="#124e89" />
    <style>
      :root {
        --panel: rgba(8, 28, 46, 0.92); --line: rgba(159, 211, 255, 0.28); --ink: #eaf6ff; --muted: #9fc3dd;
        --sun: #ffd23f; --kelp: #6fd08c; --bad: #ff6b6b; --warn: #feae34;
        --font-display: "Pixelify Sans", "Courier New", monospace; --font-body: "Work Sans", "Helvetica Neue", Arial, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #0b1a2e; color: var(--ink); font: 14px/1.4 var(--font-body); overflow: hidden; touch-action: none; }
      header { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
      header h1 { margin: 0 8px 0 4px; font: 700 20px/1 var(--font-display); color: var(--sun); }
      button, .btn { min-height: 40px; padding: 6px 12px; border-radius: 4px; border: 2px solid var(--line); background: #10304d; color: var(--ink); font: 600 14px/1.1 var(--font-body); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
      button[aria-pressed="true"] { border-color: var(--kelp); color: #fff; }
      button.problems.has { border-color: var(--warn); }
      button.problems.err { border-color: var(--bad); }
      .grow { flex: 1; }
      #regions { display: flex; gap: 4px; flex-wrap: wrap; }
      #regions button { min-height: 32px; padding: 4px 8px; font-size: 12px; }
      #stage { position: absolute; left: 0; right: 0; bottom: 0; top: 0; }
      #map { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
      #info { position: absolute; left: 10px; bottom: 10px; max-width: min(460px, calc(100% - 20px)); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: none; }
      #info.open { display: block; }
      #info h2 { margin: 0 0 4px; font: 700 16px/1.2 var(--font-display); color: var(--sun); }
      #info .row { color: var(--muted); font-size: 13px; }
      #info .issue { margin-top: 6px; font-size: 13px; }
      .issue.error { color: var(--bad); } .issue.warn { color: var(--warn); }
      #side { position: absolute; right: 10px; top: 10px; width: min(380px, calc(100% - 20px)); max-height: calc(100% - 20px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: none; }
      #side.open { display: block; }
      #side h2 { margin: 0 0 8px; font: 700 16px/1.2 var(--font-display); color: var(--sun); }
      #side li { margin: 0 0 8px; cursor: pointer; }
      #side ol { padding-left: 18px; margin: 0; }
      #zoom { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; }
      #zoom button { min-width: 44px; justify-content: center; }
      #scaleNote { position: absolute; left: 50%; transform: translateX(-50%); bottom: 14px; font-size: 12px; color: var(--muted); background: rgba(0,0,0,.35); padding: 3px 6px; border-radius: 4px; pointer-events: none; }
      main { position: relative; height: calc(100% - var(--head, 58px)); }
    </style>
  </head>
  <body>
    <header id="head">
      <a class="btn" href="index.html" title="Back to the game">‹ Game</a>
      <h1>Map</h1>
      <div id="regions" role="group" aria-label="Jump to a region"></div>
      <span class="grow"></span>
      <button id="btnLayers" aria-pressed="false">Layers</button>
      <button id="btnProblems" class="problems">Problems</button>
    </header>
    <main>
      <div id="stage"><canvas id="map" aria-label="Map of the whole sea"></canvas></div>
      <div id="scaleNote"></div>
      <div id="info" role="status"></div>
      <div id="side"></div>
      <div id="zoom">
        <button id="zoomOut" aria-label="Zoom out">−</button>
        <button id="zoomIn" aria-label="Zoom in">+</button>
        <button id="zoomAll">Whole sea</button>
      </div>
    </main>
    <script type="module" src="/src/map/main.ts"></script>
  </body>
</html>
