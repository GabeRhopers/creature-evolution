<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="data:," />
    <title>Creature Evolution</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        /* Layout: live ocean behind; centered title column; play block; option cards; food-chain strip. */
        --deep: #061a2c;      /* deep water */
        --panel: rgba(8, 28, 46, 0.82);
        --line: rgba(159, 211, 255, 0.28);
        --ink: #eaf6ff;
        --muted: #9fc3dd;
        --sun: #ffd23f;       /* croc-eye yellow: primary action */
        --kelp: #6fd08c;      /* growth green */
        --danger: #ff6b6b;
        --font-display: "Pixelify Sans", "Courier New", monospace;
        --font-body: "Work Sans", "Helvetica Neue", Arial, sans-serif;
        color-scheme: dark;
      }
      html, body { margin: 0; padding: 0; height: 100%; background: var(--deep); overflow: hidden; touch-action: none; }
      #game { width: 100vw; height: 100vh; }
      #tuning {
        position: fixed; top: 8px; right: 8px; z-index: 10; display: none;
        background: rgba(8, 24, 40, 0.88); color: #dff1ff; font: 12px/1.4 system-ui, sans-serif;
        padding: 10px 12px; border-radius: 8px; max-height: 90vh; overflow-y: auto; width: 240px;
      }
      #tuning label { display: block; margin-top: 6px; }
      #tuning input { width: 100%; }
      #tuning .v { float: right; color: #9fd3ff; }

      /* ---------- Home / pause overlays ---------- */
      .overlay {
        position: fixed; inset: 0; z-index: 20; display: none; overflow-y: auto;
        color: var(--ink); font: 15px/1.45 var(--font-body);
        background: linear-gradient(180deg, rgba(6, 26, 44, 0.15) 0%, rgba(6, 26, 44, 0.55) 45%, rgba(4, 16, 28, 0.94) 100%);
        -webkit-user-select: none; user-select: none; touch-action: manipulation;
      }
      .overlay.open { display: block; }
      .home-inner { min-height: 100%; display: grid; align-content: center; justify-items: center; gap: 18px; padding: 28px 16px 36px; box-sizing: border-box; }
      .logo { text-align: center; display: grid; gap: 6px; justify-items: center; }
      .logo h1 {
        margin: 0; font: 700 clamp(40px, 8.5vw, 92px)/0.95 var(--font-display); letter-spacing: 0.02em;
        color: var(--sun); text-shadow: 0 4px 0 #8a5a00, 0 8px 24px rgba(0, 0, 0, 0.55); text-wrap: balance;
      }
      .logo h1 span { color: var(--kelp); text-shadow: 0 4px 0 #1d5e2c, 0 8px 24px rgba(0, 0, 0, 0.55); }
      .tagline { margin: 0; font: 600 clamp(15px, 2.2vw, 19px)/1.3 var(--font-body); color: var(--ink); letter-spacing: 0.04em; }
      #heroCroc { width: min(300px, 70vw); height: auto; image-rendering: pixelated; filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.5)); }

      .play-block { display: grid; gap: 10px; justify-items: center; }
      .btn {
        font: 600 15px/1 var(--font-body); color: var(--ink); background: var(--panel); border: 1px solid var(--line);
        border-radius: 12px; padding: 12px 16px; min-height: 46px; cursor: pointer; touch-action: manipulation;
      }
      .btn:hover { border-color: var(--muted); }
      .btn:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
      .btn-play {
        font: 700 30px/1 var(--font-display); letter-spacing: 0.08em; color: #1b1400; background: var(--sun);
        border: 0; border-radius: 16px; padding: 18px 64px; box-shadow: 0 6px 0 #a87a00, 0 14px 30px rgba(0, 0, 0, 0.4);
      }
      .btn-play:active { transform: translateY(3px); box-shadow: 0 3px 0 #a87a00, 0 8px 18px rgba(0, 0, 0, 0.4); }
      .seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
      .seg button { font: 600 14px/1 var(--font-body); color: var(--muted); background: none; border: 0; border-radius: 9px; padding: 10px 16px; min-height: 40px; cursor: pointer; }
      .seg button[aria-pressed="true"] { background: var(--kelp); color: #062012; }
      .seg button:focus-visible { outline: 2px solid var(--sun); }
      .heroes { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
      .hero-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 128px; padding: 6px 10px 8px; background: var(--panel); border: 2px solid var(--line); border-radius: 12px; color: var(--muted); font: 700 15px/1.1 var(--font-body); cursor: pointer; }
      .hero-btn canvas { width: 112px; height: 44px; image-rendering: pixelated; }
      .hero-btn .d { font: 500 11px/1.2 var(--font-body); max-width: 150px; text-align: center; }
      .hero-btn[aria-pressed="true"] { border-color: var(--kelp); color: #fff; }
      .hero-btn:focus-visible { outline: 2px solid var(--sun); }
      .best { font: 500 13px/1 var(--font-body); color: var(--muted); font-variant-numeric: tabular-nums; }
      .best b { color: var(--sun); font-weight: 600; }

      .cards { display: grid; grid-template-columns: repeat(5, minmax(120px, 160px)); gap: 10px; }
      .card {
        display: grid; gap: 4px; justify-items: start; text-align: left; text-decoration: none;
        background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; color: var(--ink); cursor: pointer;
        font: inherit;
      }
      .card:hover { border-color: var(--sun); }
      .card:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
      .card .t { font: 700 17px/1.1 var(--font-display); color: var(--ink); }
      .card .d { font-size: 12.5px; color: var(--muted); }
      .card.studio { border-color: rgba(255, 210, 63, 0.55); }
      .card.studio .t { color: var(--sun); }

      .chain { display: grid; gap: 6px; justify-items: center; }
      .chain h2 { margin: 0; font: 700 13px/1 var(--font-display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
      .chain-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; }
      .chain-step { display: grid; justify-items: center; gap: 2px; min-width: 64px; }
      .chain-step canvas { width: 56px; height: 40px; image-rendering: auto; }
      .chain-step .n { font: 600 12px/1.1 var(--font-body); }
      .chain-step .lv { font: 500 11px/1 var(--font-body); color: var(--muted); font-variant-numeric: tabular-nums; }
      .chain-arrow { color: var(--sun); font: 700 18px/1 var(--font-display); }

      /* Panels (how to play, options, credits, pause) */
      .panel-wrap { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; padding: 16px; background: rgba(2, 10, 18, 0.6); }
      .panel-wrap.open { display: grid; }
      .panel {
        width: min(560px, 100%); max-height: 88vh; overflow-y: auto; box-sizing: border-box;
        background: #0b2238; border: 1px solid var(--line); border-radius: 18px; padding: 20px; color: var(--ink);
        font: 15px/1.5 var(--font-body); display: grid; gap: 12px;
      }
      .panel h3 { margin: 0; font: 700 26px/1.1 var(--font-display); color: var(--sun); }
      .panel h4 { margin: 4px 0 0; font: 700 15px/1.2 var(--font-display); color: var(--kelp); letter-spacing: 0.04em; }
      .panel p, .panel ul { margin: 0; }
      .panel ul { padding-left: 20px; display: grid; gap: 4px; }
      .panel a { color: var(--sun); }
      .panel .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .panel .studio-group { margin: 12px 0 6px; font-weight: 700; color: var(--muted); }
      .panel .enemy-list { display: grid; gap: 8px; margin: 8px 0; }
      .panel .enemy-row { display: grid; gap: 2px; text-align: left; }
      .panel .enemy-row span { color: var(--muted); font-size: 13px; }
      .panel .en-field { margin: 10px 0; }
      .panel .en-field input[type=range] { width: 100%; min-height: 32px; }
      .panel .en-help { color: var(--muted); font-size: 12px; }
      .ring { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 3px solid; vertical-align: -2px; }
      .toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; }
      .toggle button { min-width: 74px; }
      .toggle button[aria-pressed="true"] { background: var(--kelp); color: #062012; border-color: var(--kelp); }
      .pause-btns { display: grid; gap: 10px; }
      .pause-btns .btn { font: 700 20px/1 var(--font-display); }

      /* Continue a saved run */
      .btn-continue { display: grid; gap: 6px; justify-items: center; padding: 14px 40px; }
      .btn-continue .sub { font: 600 13px/1.2 var(--font-body); letter-spacing: 0; color: #3b2a00; }
      .perks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
      .perk { display: grid; gap: 6px; justify-items: center; text-align: center; padding: 16px 10px; min-height: 150px; align-content: start; }
      .perk:hover, .perk:focus-visible { border-color: var(--sun); }
      .perk .pi { width: 32px; height: 32px; image-rendering: pixelated; }
      .perk .pn { font: 700 18px/1.1 var(--font-display); color: var(--sun); }
      .perk .pd { font: 500 14px/1.35 var(--font-body); color: var(--ink); }
      @media (max-width: 560px) { .perks { grid-template-columns: 1fr; } .perk { min-height: 0; grid-template-columns: 44px 1fr; justify-items: start; text-align: left; } .perk .pi { grid-row: span 2; } }
      .btn-play.alt { font-size: 19px; padding: 12px 36px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); box-shadow: none; }
      .btn-ghost { background: none; }
      .btn-danger { border-color: #ff8a7a; color: #ffd2cb; }
      .saved-line { font: 500 13px/1.3 var(--font-body); color: var(--muted); text-align: center; }
      /* Quiet save signal + notices */
      #saveBadge {
        position: fixed; left: 12px; bottom: 12px; z-index: 25; pointer-events: none; opacity: 0; transition: opacity 0.3s;
        font: 600 12px/1 var(--font-body); color: var(--ink); background: rgba(6, 26, 44, 0.75); border: 1px solid var(--line);
        border-radius: 999px; padding: 7px 11px;
      }
      #saveBadge.show { opacity: 1; }
      #saveBadge.warn { border-color: #ffb36b; color: #ffe2c4; }
      #notice {
        position: fixed; left: 50%; top: 12px; transform: translateX(-50%); z-index: 40; display: none; max-width: min(520px, 92vw);
        font: 500 14px/1.4 var(--font-body); color: var(--ink); background: #0b2238; border: 1px solid #ffb36b; border-radius: 12px;
        padding: 10px 14px; gap: 10px; align-items: center;
      }
      #notice.open { display: flex; }
      #testBar {
        position: fixed; left: 50%; top: 10px; transform: translateX(-50%); z-index: 26; display: none; gap: 8px; align-items: center;
        font: 500 14px/1.2 var(--font-body); color: var(--ink); background: rgba(6, 26, 44, 0.85); border: 1px solid var(--sun);
        border-radius: 14px; padding: 6px 6px 6px 14px; max-width: 94vw; flex-wrap: wrap; justify-content: center;
      }
      #testBar.open { display: flex; }
      #testBar .btn { min-height: 40px; padding: 8px 12px; }
      .btn-yellow { background: var(--sun); color: #1b1400; border: 0; font-weight: 700; }
      .toggle select { font: 600 15px/1 var(--font-body); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; max-width: 220px; }
      .ver { font: 500 11px/1 var(--font-body); color: var(--muted); opacity: 0.8; }
      @media (prefers-reduced-motion: reduce) { #saveBadge { transition: none; } }

      @media (max-width: 760px) {
        .cards { grid-template-columns: repeat(2, minmax(130px, 1fr)); width: 100%; max-width: 380px; }
        .btn-play { padding: 16px 48px; font-size: 26px; }
        .chain-step { min-width: 54px; }
        .chain-arrow { font-size: 14px; }
      }
      @media (max-height: 640px) and (min-width: 761px) {
        .home-inner { gap: 12px; padding-top: 16px; }
        #heroCroc { width: 220px; }
      }
      @media (prefers-reduced-motion: reduce) { .btn-play:active { transform: none; } }
      .slots { display: grid; gap: 10px; }
      .slot { border: 2px solid var(--line); border-radius: 4px; padding: 10px 12px; display: grid; gap: 6px; }
      .slot.on { border-color: var(--kelp); }
      .slot-head { display: flex; gap: 8px; align-items: center; }
      .slot-name { font: 700 18px/1.1 var(--font-display); color: var(--ink); }
      .slot .tag { font: 600 11px/1 var(--font-body); color: #062012; background: var(--kelp); border-radius: 3px; padding: 3px 6px; }
      .slot-sub { font: 500 13px/1.3 var(--font-body); color: var(--muted); font-variant-numeric: tabular-nums; }
      .slot-input { font: 600 16px/1 var(--font-body); color: var(--ink); background: #0b2238; border: 2px solid var(--line); border-radius: 4px; padding: 8px 10px; min-width: 0; flex: 1 1 160px; }
      /* Controller focus: a clear ring on whatever the D-pad selected. */
      .pad-focus { outline: 3px solid var(--sun) !important; outline-offset: 2px; }
      /* Pixel art interface: square corners and hard pixel shadows (round toasts and rings stay round). */
      .btn, .btn-play, .seg, .seg button, .hero-btn, .card, .panel, .toggle, .toggle select { border-radius: 4px; }
      .btn-play { box-shadow: 0 6px 0 #a87a00, 0 0 0 3px #181425; }
      .btn-play:active { box-shadow: 0 3px 0 #a87a00, 0 0 0 3px #181425; }
      .btn-play.alt { box-shadow: 4px 4px 0 rgba(24, 20, 37, 0.85); }
      .card, .hero-btn, .panel { border-width: 2px; box-shadow: 4px 4px 0 rgba(24, 20, 37, 0.85); }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="tuning"></div>

    <!-- Home screen: sits over the live ocean (the game runs behind it in attract mode). -->
    <section id="home" class="overlay open" aria-label="Creature Evolution home">
      <div class="home-inner">
        <div class="logo">
          <canvas id="heroCroc" width="288" height="128" aria-label="The crocodile"></canvas>
          <h1>Creature <span>Evolution</span></h1>
          <p class="tagline">Start small. Eat. Grow. Rule the reef.</p>
        </div>

        <div class="play-block">
          <button id="btnContinue" class="btn btn-play btn-continue" hidden><span>CONTINUE</span><span class="sub" id="continueSub"></span></button>
          <div class="heroes" id="heroPick" role="group" aria-label="Play as"></div>
          <button id="btnPlay" class="btn btn-play">PLAY</button>
          <div class="seg" role="group" aria-label="Difficulty">
            <button data-diff="easy" aria-pressed="false">Easy</button>
            <button data-diff="normal" aria-pressed="true">Normal</button>
            <button data-diff="hard" aria-pressed="false">Hard</button>
          </div>
          <div class="best" id="bestLine">No record yet. Go set one!</div>
        </div>

        <div class="cards">
          <button class="card" id="cardHow"><span class="t">How to play</span><span class="d">Controls, eating, hiding, digesting</span></button>
          <a class="card studio" id="cardStudio" href="studio/index.html"><span class="t">Sprite Studio</span><span class="d">Draw your own creature poses</span></a>
          <button class="card" id="cardSaves"><span class="t">Saved games</span><span class="d">Up to 3 games, rename or delete</span></button>
          <button class="card" id="cardOptions"><span class="t">Options</span><span class="d">Sound, music, records</span></button>
          <button class="card" id="cardCredits"><span class="t">Credits</span><span class="d">Who made what</span></button>
        </div>

        <div class="chain" aria-label="Food chain">
          <h2>The food chain you climb</h2>
          <div class="chain-row" id="chain"></div>
        </div>
        <div class="ver" id="verLine"></div>
      </div>
    </section>

    <!-- Pop-up panels -->
    <div id="panelWrap" class="panel-wrap" role="dialog" aria-modal="true">
      <div class="panel" id="panel"></div>
    </div>

    <div id="testBar" role="region" aria-label="Test swim">
      <span>Test swim: <b id="testName"></b></span>
      <button class="btn" id="testUse">Use this look</button>
      <button class="btn btn-yellow" id="testBack">Back to studio</button>
    </div>
    <div id="saveBadge" role="status" aria-live="polite"></div>
    <div id="notice" role="alert"><span id="noticeText"></span><button class="btn" id="noticeClose">OK</button></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
