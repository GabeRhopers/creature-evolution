<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sprite Studio</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: tool rail | canvas stage | side panel (palette, preview, edit), poses + frames along the bottom. */
  --bg: #15181d;          /* workshop dark */
  --panel: #1f242c;       /* panels */
  --line: #333b47;        /* borders, grid */
  --ink: #e8edf3;         /* text */
  --muted: #95a1b2;       /* secondary text */
  --accent: #ffd23f;      /* croc-eye yellow: active tool, selection */
  --good: #6fd08c;
  --bad: #ff6b6b;
  --font-display: "Pixelify Sans", "Courier New", monospace;
  --font-body: "Work Sans", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 14px/1.4 var(--font-body);
  display: grid; grid-template-rows: auto 1fr auto; overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
button, select, input { font: inherit; color: inherit; }
button {
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 7px 10px; cursor: pointer; min-height: 38px; touch-action: manipulation;
}
button:hover { border-color: var(--muted); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.on { background: var(--accent); color: #1a1a1a; border-color: var(--accent); font-weight: 600; }
button:disabled { opacity: 0.4; cursor: default; }
select, input[type=text], input[type=number] {
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; min-height: 38px;
}
h2 { font: 700 13px/1 var(--font-display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }

/* Header */
header { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { font: 700 20px/1 var(--font-display); color: var(--accent); margin-right: 6px; white-space: nowrap; }
#projName { width: 170px; }
.grow { flex: 1; }
.backlink { font: 600 14px/1 var(--font-body); color: var(--ink, #e6f6ff); text-decoration: none; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
.backlink:hover { border-color: var(--muted); }
button.try { background: #ffd23f; color: #1b1400; border-color: #ffd23f; font-weight: 700; }
#saveState { font-size: 12px; color: var(--muted); min-width: 110px; text-align: right; }
#saveState.ok { color: var(--good); } #saveState.err { color: var(--bad); }

/* Main area */
main { display: grid; grid-template-columns: 64px 1fr 280px; min-height: 0; }
.rail { display: flex; flex-direction: column; gap: 6px; padding: 10px 8px; border-right: 1px solid var(--line); overflow-y: auto; }
.rail button { width: 46px; height: 46px; padding: 0; font-size: 20px; display: grid; place-items: center; }
.rail .sep { height: 1px; background: var(--line); margin: 4px 0; }
.stage { position: relative; overflow: auto; background:
  radial-gradient(circle at 50% 40%, #1c222b 0%, #121519 70%); display: grid; place-items: center; min-height: 0; touch-action: none; }
#cv { image-rendering: pixelated; touch-action: none; box-shadow: 0 0 0 1px var(--line), 0 12px 40px rgba(0,0,0,.45); }
.stagebar { position: absolute; left: 12px; bottom: 10px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.stagebar span { font-size: 12px; color: var(--muted); background: rgba(0,0,0,.4); padding: 4px 8px; border-radius: 6px; font-variant-numeric: tabular-nums; }
.side { border-left: 1px solid var(--line); padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.row button { flex: 1 1 auto; }

/* Palette */
#palette { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.sw { aspect-ratio: 1; border-radius: 6px; border: 2px solid transparent; cursor: pointer; min-height: 26px; }
.sw.cur { border-color: var(--accent); box-shadow: 0 0 0 2px #000 inset; }
.sw.clear { background: repeating-conic-gradient(#666 0 25%, #999 0 50%) 0 0 / 10px 10px; }
.curcolor { display: flex; align-items: center; gap: 8px; }
#curSwatch { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line); }
input[type=color] { width: 44px; height: 38px; border: 1px solid var(--line); border-radius: 8px; background: none; padding: 2px; }

/* Preview */
#preview { width: 100%; image-rendering: pixelated; border-radius: 8px; border: 1px solid var(--line); }
.label { font-size: 12px; color: var(--muted); }

/* Bottom: poses and frames */
footer { border-top: 1px solid var(--line); padding: 8px 16px 10px; display: grid; gap: 8px; }
#poses { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
#poses button { white-space: nowrap; }
#poses .count { font-size: 11px; opacity: .7; margin-left: 4px; }
.framesrow { display: flex; gap: 10px; align-items: flex-start; overflow-x: auto; }
.tight button { flex: 0 0 auto; }
.slot { width: 112px; min-width: 112px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 6px; display: grid; gap: 4px; cursor: pointer; position: relative; }
.slot canvas { width: 100%; height: 50px; object-fit: contain; image-rendering: pixelated; background: repeating-conic-gradient(#2a2f37 0 25%, #232830 0 50%) 0 0 / 8px 8px; border-radius: 6px; }
.slot .n { font-size: 11px; color: var(--muted); }
.slot.cur { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.slot.empty { display: grid; place-items: center; color: var(--muted); border-style: dashed; font-size: 13px; text-align: center; }
.frameops { display: flex; flex-direction: column; gap: 6px; }
.frameops .row { flex-wrap: nowrap; }
.frameops button { min-width: 120px; }

/* Modal */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; place-items: center; z-index: 10; padding: 16px; }
.modal.open { display: grid; }
.dialog { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; width: min(460px, 100%); max-height: 90%; overflow: auto; display: grid; gap: 12px; }
.dialog h3 { margin: 0; font: 700 18px/1.2 var(--font-display); color: var(--accent); }
.dialog .row button { flex: 0 1 auto; }
.plist { display: grid; gap: 6px; }
.plist .item { display: flex; gap: 6px; align-items: center; }
.plist .item button:first-child { flex: 1; text-align: left; }
#toast { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); background: #000c; color: var(--ink); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
#toast.show { opacity: 1; }

@media (max-width: 900px) {
  main { grid-template-columns: 104px 1fr; grid-template-rows: 1fr auto; }
  .rail { display: grid; grid-template-columns: repeat(2, 42px); align-content: start; gap: 6px; }
  .rail .sep { grid-column: 1 / -1; }
  .side { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); flex-direction: row; overflow-x: auto; overflow-y: hidden; max-height: 230px; }
  .side > section { min-width: 250px; }
  .slot { width: 96px; min-width: 96px; }
  .frameops button { min-width: 96px; }
  .rail button { width: 42px; height: 42px; font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
</head>
<body>
<header>
  <a class="backlink" id="btnBack" href="../index.html" title="Back to Creature Evolution">‹ Game</a>
  <div class="brand">Sprite Studio</div>
  <input id="projName" type="text" aria-label="Project name" value="">
  <button id="btnProjects" title="Open, create or delete projects">Projects</button>
  <button id="btnSettings" title="Canvas size">Canvas</button>
  <div class="grow"></div>
  <button id="btnUndo" title="Undo (Ctrl+Z)">Undo</button>
  <button id="btnRedo" title="Redo (Ctrl+Shift+Z)">Redo</button>
  <button id="btnImport" title="Import a picture into this frame">Import picture</button>
  <button id="btnExport" title="Export sprite sheet and data">Export</button>
  <button id="btnTry" class="try" title="Swim with this drawing in the game">Try in game ▶</button>
  <span id="saveState">Loading…</span>
</header>

<main>
  <nav class="rail" aria-label="Tools">
    <button data-tool="pencil" title="Pencil (B)">✏️</button>
    <button data-tool="eraser" title="Eraser (E)">🩹</button>
    <button data-tool="fill" title="Fill (G)">🪣</button>
    <button data-tool="picker" title="Pick color (I)">💧</button>
    <button data-tool="line" title="Line (L)">📏</button>
    <button data-tool="rect" title="Rectangle (R). Tap again for filled.">▭</button>
    <button data-tool="replace" title="Replace a color everywhere in the frame (C)">🎨</button>
    <button data-tool="select" title="Select / move (M)">⬚</button>
    <button data-tool="hand" title="Pan (H or hold Space)">✋</button>
    <button data-tool="mouth" title="Mouth marker: tap where the creature eats (M)">👄</button>
    <div class="sep"></div>
    <button id="mirX" title="Mirror drawing left/right">⇆</button>
    <button id="mirY" title="Mirror drawing up/down">⇅</button>
    <button id="btnOnion" title="Show previous frame faintly (onion skin)">🧅</button>
    <button id="btnGrid" title="Pixel grid">#</button>
    <button id="btnGuides" title="Framework guides: margin, body center, mouth">⊕</button>
  </nav>

  <div class="stage" id="stage">
    <canvas id="cv" width="10" height="10" aria-label="Pixel canvas"></canvas>
    <div class="stagebar">
      <button id="zoomOut" title="Zoom out">−</button>
      <button id="zoomIn" title="Zoom in">+</button>
      <button id="zoomFit" title="Fit to screen">Fit</button>
      <span id="coords">–</span>
    </div>
  </div>

  <aside class="side">
    <section>
      <h2>Preview</h2>
      <canvas id="preview" width="160" height="100"></canvas>
      <div class="row" style="margin-top:6px">
        <button id="playBtn">Pause</button>
        <label class="label" for="fps">Speed</label>
        <input id="fps" type="range" min="1" max="16" value="6" style="flex:1">
        <span id="fpsVal" class="label">6 fps</span>
      </div>
      <div class="row" style="margin-top:6px">
        <label class="label" for="bgSel">Background</label>
        <select id="bgSel">
          <option value="water">Water</option>
          <option value="checker">Checker</option>
          <option value="white">White</option>
          <option value="black">Black</option>
        </select>
      </div>
    </section>
    <section>
      <h2>Color</h2>
      <div class="curcolor">
        <div id="curSwatch"></div>
        <input type="color" id="colorEdit" title="Edit the selected palette color" aria-label="Edit selected color">
        <button id="addColor" title="Add a new color to the palette">+ Color</button>
      </div>
      <div style="height:8px"></div>
      <div id="palette" role="listbox" aria-label="Palette"></div>
      <div style="height:8px"></div>
      <div class="row">
        <select id="presets" aria-label="Add preset colors">
          <option value="">Add preset colors…</option>
          <option value="game">Game palette (Endesga 32)</option>
          <option value="croc">Crocodile greens</option>
          <option value="ocean">Ocean</option>
          <option value="pico8">PICO-8 (16)</option>
          <option value="gameboy">Game Boy (4)</option>
          <option value="skin">Skin and hair</option>
        </select>
        <button id="delColor" title="Remove the selected color if no frame uses it">Remove</button>
      </div>
    </section>

    <section>
      <h2>Edit</h2>
      <div class="row">
        <button id="copyBtn" title="Copy selection or whole frame (Ctrl+C)">Copy</button>
        <button id="cutBtn" title="Cut selection (Ctrl+X)">Cut</button>
        <button id="pasteBtn" title="Paste as a movable piece (Ctrl+V)">Paste</button>
      </div>
      <div class="row" style="margin-top:6px">
        <button id="applyBtn" title="Drop the moving piece in place (Enter)">Place</button>
        <button id="deselBtn" title="Clear selection (Esc)">Deselect</button>
        <button id="selAllBtn" title="Select everything (Ctrl+A)">Select all</button>
      </div>
      <div class="row" style="margin-top:6px">
        <button id="flipH" title="Flip left/right">Flip ⇆</button>
        <button id="flipV" title="Flip up/down">Flip ⇅</button>
        <button id="rot" title="Rotate selection 90° clockwise">Rotate ↻</button>
      </div>
      <div class="row" style="margin-top:6px">
        <button id="nudL" title="Move 1 pixel left">◀</button>
        <button id="nudU" title="Move 1 pixel up">▲</button>
        <button id="nudD" title="Move 1 pixel down">▼</button>
        <button id="nudR" title="Move 1 pixel right">▶</button>
      </div>
      <div class="row" style="margin-top:6px">
        <button id="outlineBtn" title="Draw an outline around shapes using the current color">Outline</button>
        <button id="clearBtn" title="Clear selection or whole frame (Delete)">Clear</button>
      </div>
      <p class="label" style="margin:6px 0 0">Flip, rotate, move and clear work on the selection if there is one, otherwise on the whole frame.</p>
    </section>

  </aside>
</main>

<footer>
  <div class="row tight">
    <div id="poses" role="tablist" aria-label="Poses"></div>
    <button id="addPose" title="Add a custom pose">+ Pose</button>
    <button id="renPose" title="Rename this pose">Rename</button>
    <button id="delPose" title="Delete this pose">Delete pose</button>
    <button id="origPose" title="Bring back the original (shipped) animation" hidden>Original</button>
  </div>
  <div class="framesrow">
    <div id="frames" class="framesrow"></div>
    <div class="frameops">
      <div class="row">
        <button id="dupFrame" title="Duplicate this frame into the next empty slot">Duplicate</button>
        <button id="delFrame" title="Delete this frame">Delete</button>
      </div>
      <div class="row">
        <button id="copyFrame" title="Copy the whole frame">Copy frame</button>
        <button id="pasteFrame" title="Replace this frame with the copied frame">Paste frame</button>
      </div>
      <div class="row">
        <button id="moveL" title="Move frame earlier">◀ Move</button>
        <button id="moveR" title="Move frame later">Move ▶</button>
      </div>
    </div>
  </div>
</footer>

<div class="modal" id="modal"><div class="dialog" id="dialog"></div></div>
<input type="file" id="fileIn" accept="image/*" hidden>
<div id="toast" role="status"></div>

<script>
(() => {
'use strict';

// ------------------------------------------------------------------ constants
const SLOTS = 5;                                   // frames per pose
const DEFAULT_POSES = ['idle', 'move', 'attack', 'damage', 'celebrate'];
const ALPH = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz'; // palette index -> char

// Sprite frameworks (frameworks.json): canvas, pixel scale, margin, body center, mouth.
let FRAMEWORKS = null;
fetch('frameworks.json').then((r) => r.json()).then((j) => { FRAMEWORKS = j; try { render(); } catch {} }).catch(() => {});
function fwResolve(name) {
  if (!FRAMEWORKS || !name || !FRAMEWORKS[name]) return null;
  const f = FRAMEWORKS[name];
  return f.extends ? { ...fwResolve(f.extends), ...f } : { ...f };
}
function fwNames() { return FRAMEWORKS ? Object.keys(FRAMEWORKS).filter((k) => !k.startsWith('_')) : []; }
/** Put the framework's markers on a project (keeps markers it already has unless `reset`). */
function applyFramework(p, name, reset) {
  const f = fwResolve(name); if (!f) return;
  p.framework = name; p.pixelScale = f.pixelScale;
  if (reset || !p.bodyRadius) p.bodyRadius = f.bodyRadius;
  if (reset || !p.mouth) p.mouth = f.mouth.slice();
}
const MAX_COLORS = ALPH.length;
// The game's shared palette (Endesga 32, lospec.com): every creature, the world and the UI use it.
const ENDESGA32 = ['#181425', '#262b44', '#3a4466', '#5a6988', '#8b9bb4', '#c0cbdc', '#ffffff', '#ead4aa', '#e4a672', '#b86f50', '#733e39', '#3e2731',
  '#be4a2f', '#d77643', '#f77622', '#feae34', '#fee761', '#63c74d', '#3e8948', '#265c42', '#193c3e', '#124e89', '#0099db', '#2ce8f5',
  '#ff0044', '#a22633', '#e43b44', '#f6757a', '#e8b796', '#c28569', '#68386c', '#b55088'];
const PRESETS = {
  game: ENDESGA32,
  croc: ['#181425', '#265c42', '#3e8948', '#63c74d', '#aad678', '#fee761', '#ead4aa', '#a22633', '#f6757a'],
  ocean: ['#062038', '#0b4f7a', '#1f8fc7', '#5cc8f0', '#bfe9f7', '#f2e2b0', '#e8a33d', '#c2453b'],
  pico8: ['#000000', '#1d2b53', '#7e2553', '#008751', '#ab5236', '#5f574f', '#c2c3c7', '#fff1e8', '#ff004d', '#ffa300', '#ffec27', '#00e436', '#29adff', '#83769c', '#ff77a8', '#ffccaa'],
  gameboy: ['#0f380f', '#306230', '#8bac0f', '#9bbc0f'],
  skin: ['#3b2219', '#6b3e26', '#a0663f', '#d39b6a', '#f1c9a0', '#ffe3cc', '#2b1b0e', '#e8c14a'],
};

// ------------------------------------------------------------------ state
const S = {
  id: null,                 // project id in storage
  rev: 0,                   // cloud revision this copy is based on
  project: null,            // {name, w, h, palette:[hex], poses:[{name,fps,frames:[Int16Array]}]}
  pose: 0, frame: 0,
  color: 1,                 // palette index; -1 = transparent
  tool: 'pencil', rectFill: false,
  zoom: 12, grid: true, onion: true, mirX: false, mirY: false, guides: true,
  sel: null,                // {x,y,w,h}
  float: null,              // {x,y,w,h,data:Int16Array} movable piece
  clip: null,               // {w,h,data}
  frameClip: null,          // Int16Array
  undo: [], redo: [],
  dirty: false,
};

const $ = (id) => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const stage = $('stage');

// ------------------------------------------------------------------ helpers
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800);
}
const P = () => S.project;
const curPose = () => P().poses[S.pose];
const curFrame = () => curPose().frames[S.frame];
const blank = () => new Int16Array(P().w * P().h).fill(-1);
const idx = (x, y) => y * P().w + x;
const inside = (x, y) => x >= 0 && y >= 0 && x < P().w && y < P().h;
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgbToHex(r, g, b) { return '#' + [r, g, b].map((v) => v.toString(16).padStart(2, '0')).join(''); }

// ------------------------------------------------------------------ serialization
function encodeFrame(f) { let s = ''; for (const v of f) s += v < 0 ? '.' : ALPH[v]; return s; }
function decodeFrame(s, n) {
  const f = new Int16Array(n).fill(-1);
  for (let i = 0; i < Math.min(n, s.length); i++) { const c = s[i]; f[i] = c === '.' ? -1 : ALPH.indexOf(c); }
  return f;
}
const FW_FIELDS = ['framework', 'bodyRadius', 'mouth', 'pixelScale', 'mouthRadius', 'seedVersion'];
function serialize(p) {
  const out = { name: p.name, w: p.w, h: p.h, palette: p.palette.slice(),
    poses: p.poses.map((po) => ({ name: po.name, fps: po.fps, frames: po.frames.map(encodeFrame) })) };
  for (const k of FW_FIELDS) if (p[k] !== undefined && p[k] !== null) out[k] = Array.isArray(p[k]) ? p[k].slice() : p[k];
  return out;
}
function deserialize(d) {
  const w = d.w | 0, h = d.h | 0;
  const p = { name: String(d.name || 'Untitled'), w, h, palette: (d.palette || []).slice(0, MAX_COLORS),
    poses: (d.poses || []).map((po) => ({ name: String(po.name), fps: po.fps || 6,
      frames: (po.frames || []).slice(0, SLOTS).map((s) => decodeFrame(String(s), w * h)) })) };
  if (typeof d.framework === 'string') p.framework = d.framework;
  if (d.bodyRadius > 0) p.bodyRadius = +d.bodyRadius;
  if (Array.isArray(d.mouth) && d.mouth.length === 2) p.mouth = [d.mouth[0] | 0, d.mouth[1] | 0];
  if (d.pixelScale > 0) p.pixelScale = +d.pixelScale;
  if (d.mouthRadius > 0) p.mouthRadius = +d.mouthRadius;
  if (d.seedVersion > 0) p.seedVersion = +d.seedVersion;
  return p;
}
function newProject(name, w, h, fwName) {
  const f = fwResolve(fwName);
  if (f) { w = f.canvas[0]; h = f.canvas[1]; }
  const p = { name, w, h, palette: PRESETS.game.slice(),
    poses: DEFAULT_POSES.map((n) => ({ name: n, fps: 6, frames: n === 'idle' ? [new Int16Array(w * h).fill(-1)] : [] })) };
  if (f) applyFramework(p, fwName, true);
  return p;
}

// ------------------------------------------------------------------ undo
function snapshot() { return JSON.stringify(serialize(P())); }
function pushUndo() {
  S.undo.push({ s: snapshot(), pose: S.pose, frame: S.frame });
  if (S.undo.length > 80) S.undo.shift();
  S.redo.length = 0;
}
function restore(entry) {
  S.project = deserialize(JSON.parse(entry.s));
  S.pose = Math.min(entry.pose, P().poses.length - 1);
  S.frame = Math.min(entry.frame, Math.max(0, curPose().frames.length - 1));
  S.float = null;
}
function undo() { if (!S.undo.length) return; S.redo.push({ s: snapshot(), pose: S.pose, frame: S.frame }); restore(S.undo.pop()); changed(true); }
function redo() { if (!S.redo.length) return; S.undo.push({ s: snapshot(), pose: S.pose, frame: S.frame }); restore(S.redo.pop()); changed(true); }

// ------------------------------------------------------------------ drawing primitives
function mirrorPoints(x, y) {
  const pts = [[x, y]]; const w = P().w, h = P().h;
  if (S.mirX) pts.push([w - 1 - x, y]);
  if (S.mirY) pts.push([x, h - 1 - y]);
  if (S.mirX && S.mirY) pts.push([w - 1 - x, h - 1 - y]);
  return pts;
}

// ------------------------------------------------------------------ frames and poses
function frameOp(op) {
  commitFloat(); const frames = curPose().frames; const i = S.frame;
  if (op === 'dup' && frames.length && frames.length < SLOTS) { pushUndo(); frames.splice(i + 1, 0, frames[i].slice()); S.frame = i + 1; }
  if (op === 'del' && frames.length) { pushUndo(); frames.splice(i, 1); S.frame = Math.max(0, Math.min(i, frames.length - 1)); }
  if (op === 'copy' && frames[i]) { S.frameClip = frames[i].slice(); toast('Frame copied. Paste it into any pose.'); renderFrames(); return; }
  if (op === 'paste' && S.frameClip) { pushUndo(); if (!frames.length) { frames.push(S.frameClip.slice()); S.frame = 0; } else frames[i] = S.frameClip.slice(); }
  if (op === 'L' && i > 0) { pushUndo(); [frames[i - 1], frames[i]] = [frames[i], frames[i - 1]]; S.frame = i - 1; }
  if (op === 'R' && i < frames.length - 1) { pushUndo(); [frames[i + 1], frames[i]] = [frames[i], frames[i + 1]]; S.frame = i + 1; }
  changed(true);
}

// ------------------------------------------------------------------ modal helpers (no browser prompts)

function closeModal() { $('modal').classList.remove('open'); }

// ------------------------------------------------------------------ storage (cloud db + instant local copy)
// Every edit is copied to this device within a moment, so closing the page
// never loses a stroke. The cloud copy follows after a short pause. Each cloud
// save carries a revision number and the device that wrote it: if another
// device saved in between, we stop and ask instead of overwriting. Earlier
// versions are kept in history, and deleted projects go to the trash.
let db = null, downloads = null, saving = false, saveTimer = null, localTimer = null, retryTimer = null, retryDelay = 4000;
const LOCAL = 'spritestudio:';
const MAX_DOC = 256 * 1024, WARN_DOC = 200 * 1024;
const HISTORY_KEEP = 20, HISTORY_EVERY_MS = 3 * 60 * 1000, TRASH_DAYS = 30;
const DEVICE = (() => { try { let d = localStorage.getItem('spritestudio.device'); if (!d) { d = Math.random().toString(36).slice(2, 10); localStorage.setItem('spritestudio.device', d); } return d; } catch { return 'nodevice'; } })();
let lastHistoryAt = 0, sizeWarned = false;
const setSave = (txt, cls) => { const el = $('saveState'); el.textContent = txt; el.className = cls || ''; el.title = cls === 'err' ? 'Tap to try again' : ''; };
$('saveState').addEventListener('click', () => { if ($('saveState').className === 'err') { S.dirty = true; save(); } });

// Opening a project keeps its timestamp (S.stamp); only a real edit gives it a new one, so an
// untouched starter design still gets newer versions shipped with the game.
function body() { return { ...serialize(P()), updatedAt: S.stamp || new Date().toISOString() }; }
/** Instant device copy. `pending` = not yet in the cloud. */
function writeLocal(pending) {
  if (!S.id) return false;
  try { localStorage.setItem(LOCAL + S.id, JSON.stringify({ ...body(), rev: S.rev || 0, pending: !!pending })); return true; } catch { return false; }
}
function readLocal(id) { try { return JSON.parse(localStorage.getItem(LOCAL + id) || 'null'); } catch { return null; } }

function scheduleSave() {
  setSave('Saving…');
  clearTimeout(localTimer); localTimer = setTimeout(() => { if (S.dirty) writeLocal(true); }, 120);
  clearTimeout(saveTimer); saveTimer = setTimeout(save, 1200);
}

async function save(opts = {}) {
  if (!S.dirty || !S.id) return;
  if (saving) { scheduleSave(); return; }
  clearTimeout(retryTimer);
  saving = true; S.dirty = false;
  const b = body();
  const localOk = writeLocal(true);
  const size = JSON.stringify(b).length;
  if (size > WARN_DOC && !sizeWarned) { sizeWarned = true; toast('This project is getting large. Fewer frames or a smaller canvas keeps it saving to the cloud.'); }
  try {
    if (!db) { writeLocal(false); setSave(localOk ? 'Saved on this device' : 'Could not save', localOk ? 'ok' : 'err'); saving = false; return; }
    if (size > MAX_DOC) { setSave('Too big for the cloud: saved on this device', 'err'); saving = false; return; }
    const ref = db.doc('projects/' + S.id);
    const cur = await ref.get();
    const theirs = cur.exists ? cur.data() : null;
    const theirRev = theirs ? (theirs.rev || 0) : 0;
    if (theirs && theirRev > (S.rev || 0) && !opts.force) {
      // Someone else saved since we loaded: never overwrite silently.
      saving = false; S.dirty = true; setSave('Changed on another device', 'err');
      return askConflict(theirs);
    }
    if (theirs && Date.now() - lastHistoryAt > HISTORY_EVERY_MS) { await keepHistory(S.id, theirs); lastHistoryAt = Date.now(); }
    const rev = Math.max(theirRev, S.rev || 0) + 1;
    await ref.set({ ...b, rev, device: DEVICE });
    S.rev = rev; writeLocal(false); retryDelay = 4000;
    setSave(S.dirty ? 'Saving…' : 'Saved', 'ok');
  } catch (err) {
    S.dirty = true;
    setSave(localOk ? 'Saved on this device (will sync)' : 'Not saved: tap to retry', 'err');
    retryTimer = setTimeout(() => save(), retryDelay); retryDelay = Math.min(60000, retryDelay * 2);
  }
  saving = false;
}

function askConflict(theirs) {
  const when = theirs.updatedAt ? new Date(theirs.updatedAt).toLocaleString() : 'recently';
  openModal(`<h3>Changed on another device</h3><p>This project was saved somewhere else (${when}) after you opened it. What should happen to your changes?</p>
    <div class="row"><button id="cfCopy" class="on">Keep mine as a copy</button><button id="cfTheirs">Load the other version</button><button id="cfMine">Overwrite with mine</button></div>
    <p class="label">Nothing is lost either way: the version that gets replaced is kept in History.</p>`, () => {
    $('cfCopy').onclick = async () => { closeModal(); const copyP = deserialize(serialize(P())); copyP.name = P().name + ' (my copy)';
      S.id = 'p' + Date.now().toString(36); S.rev = 0; S.project = copyP; $('projName').value = copyP.name; S.dirty = true; changed(true); toast('Saved your version as a copy'); };
    $('cfTheirs').onclick = async () => { closeModal(); await keepHistory(S.id, { ...body(), rev: S.rev || 0, device: DEVICE }); S.dirty = false; await loadProject(S.id, { skipRecovery: true }); toast('Loaded the other version. Yours is in History.'); };
    $('cfMine').onclick = async () => { closeModal(); await keepHistory(S.id, theirs); S.dirty = true; await save({ force: true }); toast('Overwritten. The other version is in History.'); };
  });
}

// History: snapshots in the "history" collection, newest HISTORY_KEEP kept per project.
async function keepHistory(id, data) {
  if (!db || !data) return;
  try {
    await db.doc('history/' + id + '~' + (data.rev || 0) + '~' + Date.now().toString(36)).set({ ...data, projectId: id, keptAt: new Date().toISOString() });
    const all = await listHistory(id);
    for (const h of all.slice(HISTORY_KEEP)) await db.doc('history/' + h.key).delete();
  } catch {}
}
async function listHistory(id) {
  if (!db) return [];
  try { const snap = await db.collection('history').where('projectId', '==', id).get();
    return snap.docs.map((d) => ({ key: d.id, ...d.data() })).sort((a, b) => String(b.keptAt).localeCompare(String(a.keptAt)));
  } catch { return []; }
}

async function listProjects() {
  const out = new Map();
  if (db) { try { const snap = await db.collection('projects').get(); snap.docs.forEach((d) => { const v = d.data(); out.set(d.id, { id: d.id, name: v.name, w: v.w, h: v.h, updatedAt: v.updatedAt }); }); } catch {} }
  // Device copies that never reached the cloud show up too.
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i);
      if (k.startsWith(LOCAL) && !k.startsWith(LOCAL + 'last')) { const v = readLocal(k.slice(LOCAL.length)); const id = k.slice(LOCAL.length);
        if (v && v.w && (!db || v.pending || !out.size) && !out.has(id)) out.set(id, { id, name: v.name, w: v.w, h: v.h, updatedAt: v.updatedAt }); } } } catch {}
  return [...out.values()].sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));
}

async function loadProject(id, opts = {}) {
  let cloud = null;
  if (db) { try { const d = await db.doc('projects/' + id).get(); if (d.exists) cloud = d.data(); } catch {} }
  const local = readLocal(id);
  let data = cloud || local;
  if (!data) return false;
  const apply = (d, dirty) => {
    S.id = id; S.rev = (cloud && cloud.rev) || 0; S.project = deserialize(d); S.pose = 0; S.frame = 0; S.sel = null; S.float = null; S.undo = []; S.redo = [];
    S.color = Math.min(1, P().palette.length - 1); $('projName').value = P().name;
    try { localStorage.setItem(LOCAL + 'last', id); } catch {}
    fitZoom(); S.dirty = dirty; changed(dirty); S.stamp = d.updatedAt || null;
    if (!dirty) { writeLocal(false); setSave(db ? 'Saved' : 'Saved on this device', 'ok'); }
  };
  // Startup recovery: unsaved device changes newer than the cloud copy.
  if (!opts.skipRecovery && cloud && local && local.pending && String(local.updatedAt) > String(cloud.updatedAt || '')) {
    apply(cloud, false);
    openModal(`<h3>Recover unsaved changes?</h3><p>This device has changes to “${(local.name || id).replace(/</g, '&lt;')}” from ${new Date(local.updatedAt).toLocaleString()} that did not reach the cloud.</p>
      <div class="row"><button id="rcYes" class="on">Recover my changes</button><button id="rcNo">Use the cloud version</button></div>`, () => {
      $('rcYes').onclick = () => { closeModal(); apply(local, true); toast('Changes recovered'); };
      $('rcNo').onclick = async () => { closeModal(); await keepHistory(id, { ...local, projectId: id }); writeLocal(false); toast('Using the cloud version. Your device changes are in History.'); };
    });
    return true;
  }
  apply(data, !cloud && !!db); // a device-only project gets uploaded
  return true;
}

function startNew(name, w, h, fwName) {
  S.id = 'p' + Date.now().toString(36); S.rev = 0; S.project = newProject(name, w, h, fwName);
  S.pose = 0; S.frame = 0; S.sel = null; S.float = null; S.undo = []; S.redo = []; S.color = 1;
  $('projName').value = name; fitZoom(); S.dirty = true; changed(true);
}

// Trash: deleted projects stay restorable for TRASH_DAYS days.
async function trashProject(id) {
  const local = readLocal(id);
  let data = null;
  if (db) { try { const d = await db.doc('projects/' + id).get(); if (d.exists) data = d.data(); } catch {} }
  data = data || local;
  if (db && data) { await db.doc('trash/' + id).set({ ...data, deletedAt: new Date().toISOString() }); await db.doc('projects/' + id).delete(); }
  else if (data) { try { localStorage.setItem('spritestudio-trash:' + id, JSON.stringify({ ...data, deletedAt: new Date().toISOString() })); } catch {} }
  try { localStorage.removeItem(LOCAL + id); } catch {}
}
async function listTrash() {
  const out = []; const cutoff = new Date(Date.now() - TRASH_DAYS * 864e5).toISOString();
  if (db) { try { const snap = await db.collection('trash').get();
    for (const d of snap.docs) { const v = d.data(); if (String(v.deletedAt) < cutoff) { db.doc('trash/' + d.id).delete().catch(() => {}); continue; } out.push({ id: d.id, ...v }); } } catch {} }
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('spritestudio-trash:')) { const v = JSON.parse(localStorage.getItem(k)); if (String(v.deletedAt) >= cutoff) out.push({ id: k.slice(19), ...v, localOnly: true }); else localStorage.removeItem(k); } } } catch {}
  return out.sort((a, b) => String(b.deletedAt).localeCompare(String(a.deletedAt)));
}
async function restoreFromTrash(item) {
  const { deletedAt, localOnly, id, ...data } = item;
  if (db) { await db.doc('projects/' + id).set({ ...data, rev: (data.rev || 0) + 1, device: DEVICE }); if (!localOnly) await db.doc('trash/' + id).delete(); }
  else { try { localStorage.setItem(LOCAL + id, JSON.stringify(data)); } catch {} }
  try { localStorage.removeItem('spritestudio-trash:' + id); } catch {}
}

const esc = (t) => String(t || '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
async function openProjects() {

  const trashItems = trash.map((p, i) => `<div class="item"><span style="flex:1">${esc(p.name || p.id)} <span class="label">deleted ${new Date(p.deletedAt).toLocaleDateString()}</span></span><button data-untrash="${i}">Restore</button></div>`).join('');
  openModal(`<h3>Projects</h3><div class="plist">${items || '<p class="label">No saved projects yet.</p>'}</div>
    <div class="row"><button id="npHist" ${db && S.id ? '' : 'disabled'}>History of this project</button></div>
    <h3>New project</h3>
    <div class="row"><input type="text" id="npName" value="My character" aria-label="Name"><select id="npF" aria-label="Sprite framework">${fwOptions('default')}</select></div>
    <div class="row"><span class="label">Free size:</span><input type="number" id="npW" value="48" min="4" max="192" aria-label="Width" style="width:74px"><span class="label">×</span><input type="number" id="npH" value="24" min="4" max="192" aria-label="Height" style="width:74px"></div>
    <div class="row"><button id="npGo" class="on">Create</button><button id="npDup">Duplicate current</button><button id="npClose">Close</button></div>
    ${trashItems ? `<h3>Recently deleted</h3><p class="label">Kept for ${TRASH_DAYS} days.</p><div class="plist">${trashItems}</div>` : ''}
    <p class="label">${db ? 'Projects are saved to the cloud with the game. Tap Try in game to swim with one. Every change is also kept on this device right away.' : 'Cloud saving is not available here, so projects are kept on this device only.'}</p>`, () => {
    document.querySelectorAll('[data-open]').forEach((b) => b.onclick = async () => { closeModal(); await save(); await loadProject(b.dataset.open); });
    document.querySelectorAll('[data-del]').forEach((b) => b.onclick = () => askConfirm('Delete project?', `It moves to Recently deleted, where you can restore it for ${TRASH_DAYS} days.`, async () => {

      if (b.dataset.del === S.id) startNew('My character', 48, 24); toast('Moved to Recently deleted'); }));
    document.querySelectorAll('[data-untrash]').forEach((b) => b.onclick = async () => { const it = trash[+b.dataset.untrash];
      try { await restoreFromTrash(it); closeModal(); await save(); await loadProject(it.id); toast('Project restored'); } catch { toast('Could not restore right now'); } });
    $('npHist').onclick = openHistory;
    $('npGo').onclick = async () => { const w = Math.max(4, Math.min(192, +$('npW').value | 0)), h = Math.max(4, Math.min(192, +$('npH').value | 0));
      const n = $('npName').value.trim() || 'My character'; const fwName = $('npF').value; await save(); closeModal(); startNew(n, w, h, fwName); };
    $('npDup').onclick = async () => { await save(); const copyP = deserialize(serialize(P())); copyP.name = P().name + ' copy';
      S.id = 'p' + Date.now().toString(36); S.rev = 0; S.project = copyP; $('projName').value = copyP.name; S.dirty = true; closeModal(); changed(true); toast('Duplicated'); };
    $('npClose').onclick = closeModal;
  });
}

async function openHistory() {
  openModal('<h3>History</h3><p class="label">Loading…</p>');
  const hist = await listHistory(S.id);
  const rows = hist.map((h, i) => `<div class="item"><span style="flex:1">${new Date(h.keptAt).toLocaleString()} <span class="label">${(h.poses || []).length} poses</span></span><button data-restore="${i}">Restore</button></div>`).join('');
  openModal(`<h3>History of “${esc(P().name)}”</h3><p class="label">Earlier versions are kept automatically (the last ${HISTORY_KEEP}). Restoring keeps the current version in History too.</p>
    <div class="plist">${rows || '<p class="label">No earlier versions yet. They appear after a few minutes of drawing.</p>'}</div>
    <div class="row"><button id="hClose">Close</button></div>`, () => {
    $('hClose').onclick = closeModal;
    document.querySelectorAll('[data-restore]').forEach((b) => b.onclick = async () => {
      const h = hist[+b.dataset.restore];
      await keepHistory(S.id, { ...body(), rev: S.rev || 0, device: DEVICE });
      const { key, projectId, keptAt, ...data } = h;
      S.project = deserialize(data); S.pose = 0; S.frame = 0; S.sel = null; S.float = null; S.undo = []; S.redo = [];
      $('projName').value = P().name; fitZoom(); S.dirty = true; changed(true); closeModal(); toast('Earlier version restored');

function fwOptions(sel) {
  return '<option value="">None (free size)</option>' + fwNames().map((n) => `<option value="${n}" ${n === sel ? 'selected' : ''}>${fwResolve(n).name} · ${fwResolve(n).canvas.join('×')}</option>`).join('');
}
function openCanvasSettings() {
  const fw = fwResolve(P().framework);
  openModal(`<h3>Canvas</h3>
    <div class="row"><label class="label" for="csF">Sprite framework</label><select id="csF">${fwOptions(P().framework)}</select></div>
    <p class="label">A framework sets the canvas size, a safe margin (red), the body center and hitbox (white) and the mouth marker (yellow, move it with the 👄 tool), so the drawing fits the game.</p>
    <div class="row"><label class="label" for="csR">Hitbox radius</label><input type="number" id="csR" value="${P().bodyRadius || (fw ? fw.bodyRadius : 8)}" min="2" max="40" style="width:80px"></div>
    <h3>Canvas size</h3><p class="label">Resizing keeps the art anchored to the chosen spot. Pixels outside the new size are cut.</p>
    <div class="row"><label class="label" for="csW">Width</label><input type="number" id="csW" value="${P().w}" min="4" max="192" style="width:80px">
    <label class="label" for="csH">Height</label><input type="number" id="csH" value="${P().h}" min="4" max="192" style="width:80px"></div>
    <div class="row"><label class="label" for="csA">Anchor</label><select id="csA"><option value="c">Center</option><option value="bl">Bottom left</option><option value="b">Bottom center</option><option value="tl">Top left</option></select></div>
    <div class="row"><button id="csOk" class="on">Apply</button><button id="csNo">Cancel</button></div>`, () => {
    $('csNo').onclick = closeModal;
    $('csF').onchange = () => { const f = fwResolve($('csF').value); if (f) { $('csW').value = f.canvas[0]; $('csH').value = f.canvas[1]; $('csA').value = 'c'; $('csR').value = f.bodyRadius; } };
    $('csOk').onclick = () => {
      const fwName = $('csF').value;
      const nw = Math.max(4, Math.min(192, +$('csW').value | 0)), nh = Math.max(4, Math.min(192, +$('csH').value | 0)); const a = $('csA').value;
      const ow = P().w, oh = P().h; pushUndo();
      const ox = a === 'c' || a === 'b' ? Math.floor((nw - ow) / 2) : 0;
      const oy = a === 'c' ? Math.floor((nh - oh) / 2) : (a === 'bl' || a === 'b') ? nh - oh : 0;
      for (const po of P().poses) po.frames = po.frames.map((f) => { const n = new Int16Array(nw * nh).fill(-1);
        for (let y = 0; y < oh; y++) for (let x = 0; x < ow; x++) { const X = x + ox, Y = y + oy; if (X >= 0 && Y >= 0 && X < nw && Y < nh) n[Y * nw + X] = f[y * ow + x]; } return n; });
      P().w = nw; P().h = nh;
      if (fwName) { const switched = P().framework !== fwName; applyFramework(P(), fwName, switched);
        if (P().mouth && !switched) P().mouth = [Math.min(nw - 1, P().mouth[0] + ox), Math.min(nh - 1, P().mouth[1] + oy)];
        P().bodyRadius = Math.max(2, Math.min(40, +$('csR').value || P().bodyRadius)); }
      else { delete P().framework; delete P().bodyRadius; delete P().mouth; delete P().pixelScale; }
      S.sel = null; S.float = null; closeModal(); fitZoom(); changed(true);
    };
  });
}

// ------------------------------------------------------------------ import picture
function nearestIndex(rgb, pal) { let best = -1, bd = 1e9; pal.forEach((h, i) => { const [r, g, b] = hexToRgb(h);
  const d = (r - rgb[0]) ** 2 + (g - rgb[1]) ** 2 + (b - rgb[2]) ** 2; if (d < bd) { bd = d; best = i; } }); return { i: best, d: bd }; }
$('btnImport').onclick = () => {
  openModal(`<h3>Import a picture</h3><p class="label">Turns a drawing or photo into pixels for the current frame, using your palette (new colors are added when needed).</p>
    <div class="row"><label><input type="checkbox" id="imWhite" checked> White background = transparent</label></div>
    <div class="row"><label class="label" for="imCols">Max new colors</label><input type="number" id="imCols" value="8" min="0" max="32" style="width:80px"></div>
    <div class="row"><button id="imPick" class="on">Choose picture…</button><button id="imNo">Cancel</button></div>`, () => {
    $('imNo').onclick = closeModal;
    $('imPick').onclick = () => { S.importOpts = { white: $('imWhite').checked, cols: +$('imCols').value | 0 }; closeModal(); $('fileIn').click(); };
  });
};
$('fileIn').onchange = () => {
  const file = $('fileIn').files[0]; if (!file) return;
  const img = new Image(); img.onload = () => {
    const p = P(); const opts = S.importOpts || { white: true, cols: 8 };
    // Crop to the drawing's non-white bounds, then fit inside the canvas keeping proportions.
    const big = document.createElement('canvas'); big.width = img.width; big.height = img.height;
    const bg = big.getContext('2d'); bg.drawImage(img, 0, 0); const src = bg.getImageData(0, 0, img.width, img.height).data;
    let minX = img.width, minY = img.height, maxX = -1, maxY = -1;
    for (let y = 0; y < img.height; y += 2) for (let x = 0; x < img.width; x += 2) { const k = (y * img.width + x) * 4;
      const white = src[k] > 235 && src[k + 1] > 235 && src[k + 2] > 235; if (src[k + 3] > 40 && !white) { minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y); } }
    if (maxX < 0) { toast('The picture looks empty'); return; }
    const bw = maxX - minX + 1, bh = maxY - minY + 1; const s = Math.min(p.w / bw, p.h / bh);
    const tw = Math.max(1, Math.round(bw * s)), th = Math.max(1, Math.round(bh * s));
    const offX = Math.floor((p.w - tw) / 2), offY = Math.floor((p.h - th) / 2);
    pushUndo(); const f = ensureFrame(); f.fill(-1); let added = 0;
    for (let y = 0; y < th; y++) for (let x = 0; x < tw; x++) {
      // Sample the center of each target pixel's area.
      const sx = Math.min(img.width - 1, Math.floor(minX + (x + 0.5) / s)), sy = Math.min(img.height - 1, Math.floor(minY + (y + 0.5) / s));
      const k = (sy * img.width + sx) * 4; const rgb = [src[k], src[k + 1], src[k + 2]];
      if (src[k + 3] < 100) continue;
      if (opts.white && rgb[0] > 225 && rgb[1] > 225 && rgb[2] > 225) continue;
      let { i, d } = nearestIndex(rgb, p.palette);
      if ((i < 0 || d > 1800) && added < opts.cols && p.palette.length < MAX_COLORS) { p.palette.push(rgbToHex(...rgb)); i = p.palette.length - 1; added++; }
      f[(y + offY) * p.w + (x + offX)] = i;
    }
    changed(true); toast(`Imported${added ? `, added ${added} colors` : ''}`);
  };
  img.src = URL.createObjectURL(file); $('fileIn').value = '';
};

// ------------------------------------------------------------------ export
function buildSheet(scale) {
  const p = P(); const cols = SLOTS; const rows = p.poses.length;
  const c = document.createElement('canvas'); c.width = p.w * cols * scale; c.height = p.h * rows * scale;
  const g = c.getContext('2d'); const frames = {};
  p.poses.forEach((po, r) => po.frames.forEach((f, i) => {
    for (let k = 0; k < f.length; k++) if (f[k] >= 0) { g.fillStyle = p.palette[f[k]]; g.fillRect((i * p.w + (k % p.w)) * scale, (r * p.h + ((k / p.w) | 0)) * scale, scale, scale); }
    frames[`${po.name}_${i + 1}`] = { frame: { x: i * p.w * scale, y: r * p.h * scale, w: p.w * scale, h: p.h * scale }, rotated: false, trimmed: false,
      spriteSourceSize: { x: 0, y: 0, w: p.w * scale, h: p.h * scale }, sourceSize: { w: p.w * scale, h: p.h * scale } };
  }));
  const anims = Object.fromEntries(p.poses.map((po) => [po.name, { frames: po.frames.map((_, i) => `${po.name}_${i + 1}`), fps: po.fps }]));
  return { canvas: c, json: { frames, meta: { app: 'Sprite Studio', image: `${slug()}.png`, size: { w: c.width, h: c.height }, scale: String(scale), animations: anims } } };
}
const slug = () => (P().name || 'sprite').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'sprite';
async function saveFile(filename, data) {
  if (!downloads) return false;
  try { await downloads.save({ filename, data }); return true; }
  catch (e) { if (e && e.code === 'declined') toast('Download cancelled'); else toast('Downloads are not available here'); return null; }
}
$('btnExport').onclick = () => {
  openModal(`<h3>Export</h3><p class="label">Sprite sheet: one row per pose, one column per frame, plus a JSON file with frame positions and animation speeds.</p>
    <div class="row"><label class="label" for="exScale">Pixel size</label><select id="exScale"><option value="1">1×</option><option value="2">2×</option><option value="3" selected>3× (game)</option><option value="4">4×</option><option value="8">8×</option></select></div>
    <div class="row"><button id="exPng" class="on">Sprite sheet PNG</button><button id="exJson">Frames JSON</button><button id="exProj">Project file</button></div>
    <div class="row"><button id="exCopy">Copy JSON</button><button id="exNo">Close</button></div>
    <div id="exOut"></div>`, () => {
    $('exNo').onclick = closeModal;
    $('exPng').onclick = async () => { const { canvas } = buildSheet(+$('exScale').value);
      canvas.toBlob(async (blob) => { const ok = await saveFile(`${slug()}.png`, blob);
        if (ok === false) { $('exOut').innerHTML = '<p class="label">Press and hold the picture to save it.</p>'; const im = new Image(); im.src = canvas.toDataURL(); im.style.maxWidth = '100%'; im.style.imageRendering = 'pixelated'; $('exOut').appendChild(im); } }, 'image/png'); };
    $('exJson').onclick = async () => { const { json } = buildSheet(+$('exScale').value); const ok = await saveFile(`${slug()}.json`, JSON.stringify(json, null, 1)); if (ok === false) toast('Use Copy JSON instead'); };
    $('exProj').onclick = async () => { const ok = await saveFile(`${slug()}.sprite.json`, JSON.stringify(serialize(P()))); if (ok === false) toast('Use Copy JSON instead'); };
    $('exCopy').onclick = async () => { try { await navigator.clipboard.writeText(JSON.stringify(serialize(P()))); toast('Project JSON copied'); } catch { toast('Copy failed'); } };
  });
};

// ------------------------------------------------------------------ wiring
function setTool(t) {
  if (t === 'rect' && S.tool === 'rect') S.rectFill = !S.rectFill;
  if (t !== 'select') commitFloat();
  S.tool = t; renderButtons(); render();
}
document.querySelectorAll('[data-tool]').forEach((b) => b.onclick = () => setTool(b.dataset.tool));
$('mirX').onclick = () => { S.mirX = !S.mirX; changed(false); };
$('mirY').onclick = () => { S.mirY = !S.mirY; changed(false); };
$('btnOnion').onclick = () => { S.onion = !S.onion; changed(false); };
$('btnGrid').onclick = () => { S.grid = !S.grid; changed(false); };
$('btnGuides').onclick = () => { S.guides = !S.guides; changed(false); };
$('zoomIn').onclick = () => { S.zoom = Math.min(64, S.zoom + (S.zoom < 8 ? 1 : 2)); render(); };
$('zoomOut').onclick = () => { S.zoom = Math.max(2, S.zoom - (S.zoom <= 8 ? 1 : 2)); render(); };
$('zoomFit').onclick = fitZoom;
$('btnUndo').onclick = undo; $('btnRedo').onclick = redo;
$('copyBtn').onclick = () => copy(false); $('cutBtn').onclick = () => copy(true); $('pasteBtn').onclick = paste;
$('applyBtn').onclick = () => { commitFloat(); S.sel = null; changed(false); };
$('deselBtn').onclick = () => { commitFloat(); S.sel = null; changed(false); };
$('selAllBtn').onclick = () => { commitFloat(); S.sel = { x: 0, y: 0, w: P().w, h: P().h }; setTool('select'); changed(false); };
$('flipH').onclick = () => transform('flipH'); $('flipV').onclick = () => transform('flipV'); $('rot').onclick = () => {
  if (!S.float && S.sel) { pushUndo(); const f = curFrame(); S.float = { ...S.sel, data: readRegion(f, S.sel) }; clearRegion(f, S.sel); S.sel = null; }
  transform('rot'); setTool('select'); };
$('nudL').onclick = () => transform('L'); $('nudR').onclick = () => transform('R'); $('nudU').onclick = () => transform('U'); $('nudD').onclick = () => transform('D');
$('outlineBtn').onclick = () => transform('outline'); $('clearBtn').onclick = () => transform('clear');
$('dupFrame').onclick = () => frameOp('dup'); $('delFrame').onclick = () => frameOp('del');
$('copyFrame').onclick = () => frameOp('copy'); $('pasteFrame').onclick = () => frameOp('paste');
$('moveL').onclick = () => frameOp('L'); $('moveR').onclick = () => frameOp('R');
$('addPose').onclick = () => askText('New pose', 'eat', (n) => { pushUndo(); P().poses.push({ name: n, fps: 6, frames: [] }); S.pose = P().poses.length - 1; S.frame = 0; changed(true); });
// ------------------------------------------------------------------ restore the original design
/** The starter design this project came from (its id, or a "-vN" new-design copy of it), or null. */
function seedIdOf(id) {
  if (!id) return null;
  try { SEEDS; } catch { return null; } // the starter list is defined further down the page
  if (SEEDS[id]) return id;
  const m = /^(.+)-v\d+$/.exec(id);
  return m && SEEDS[m[1]] ? m[1] : null;
}
async function loadSeed(id) {
  try { const res = await fetch('seeds/' + id + '.json'); return res.ok ? await res.json() : null; } catch { return null; }
}
$('origPose').onclick = async () => {
  const sid = seedIdOf(S.id); if (!sid) return;
  const poseName = curPose().name;
  openModal(`<h3>Bring back the original</h3><p>Go back to the design that came with the game. You can undo this.</p>
    <div class="row"><button id="orPose" class="on">Only the “${poseName.replace(/</g, '&lt;')}” animation</button><button id="orAll">The whole drawing</button><button id="orNo">Cancel</button></div>`, () => {
    $('orNo').onclick = closeModal;
    $('orPose').onclick = async () => {
      closeModal();
      const seed = await loadSeed(sid); if (!seed) { toast('The original could not be loaded'); return; }
      const orig = deserialize(seed);
      const src = orig.poses.find((po) => po.name.toLowerCase() === poseName.toLowerCase());
      if (!src) { toast('The original has no “' + poseName + '” pose'); return; }
      if (orig.w !== P().w || orig.h !== P().h) { toast('The canvas size changed, so only the whole drawing can be restored'); return; }
      commitFloat(); pushUndo();
      // Same colors as the original, so its frames look right (existing colors keep their places).
      for (const col of orig.palette) if (!P().palette.includes(col) && P().palette.length < MAX_COLORS) P().palette.push(col);
      const map = orig.palette.map((col, i) => (P().palette[i] === col ? i : P().palette.indexOf(col)));
      curPose().fps = src.fps;
      curPose().frames = src.frames.map((f) => f.map((v) => (v < 0 ? -1 : map[v] ?? -1)));
      S.frame = 0; changed(true);
      toast('Original “' + poseName + '” animation is back');
    };
    $('orAll').onclick = async () => {
      closeModal();
      const seed = await loadSeed(sid); if (!seed) { toast('The original could not be loaded'); return; }
      commitFloat(); pushUndo();
      const name = P().name;
      S.project = deserialize(seed); P().name = name; S.pose = 0; S.frame = 0;
      changed(true);
      // Restored to the shipped design: keep its stamp, so newer shipped versions can still replace it.
      S.stamp = seed.updatedAt || null;
      toast('The original drawing is back');
    };
  });
};

$('renPose').onclick = () => askText('Rename pose', curPose().name, (n) => { pushUndo(); curPose().name = n; changed(true); });
$('delPose').onclick = () => askConfirm(`Delete pose "${curPose().name}"?`, 'Its frames are removed too. You can undo this.', () => { pushUndo(); P().poses.splice(S.pose, 1); S.pose = Math.max(0, S.pose - 1); S.frame = 0; changed(true); });
$('projName').onchange = () => { pushUndo(); P().name = $('projName').value.trim() || 'Untitled'; changed(true); };
$('btnProjects').onclick = openProjects;
$('btnTry').onclick = async () => {
  commitFloat();
  const hasArt = P().poses.some((po) => /^(idle|move)$/i.test(po.name) && po.frames.some((f) => f.some((v) => v >= 0)));
  if (!hasArt) { toast('Draw something in the idle or move pose first'); return; }
  if (!S.id) { S.id = 'p' + Date.now().toString(36); }
  S.dirty = true; writeLocal(true);
  setSave('Saving…');
  await Promise.race([save(), new Promise((r) => setTimeout(r, 3000))]); // the device copy is enough if the cloud is slow
  location.href = '../index.html?try=' + encodeURIComponent(S.id) + '&pose=' + S.pose;
}; $('btnSettings').onclick = openCanvasSettings;
$('colorEdit').oninput = () => { if (S.color < 0) return; if (!colorEditUndo) { pushUndo(); colorEditUndo = true; } P().palette[S.color] = $('colorEdit').value; render(); renderPalette(); renderFrames(); };
let colorEditUndo = false; $('colorEdit').onchange = () => { colorEditUndo = false; changed(true); };
$('addColor').onclick = () => { if (P().palette.length >= MAX_COLORS) { toast('Palette is full (62 colors)'); return; } pushUndo();
  P().palette.push(S.color >= 0 ? P().palette[S.color] : '#ffffff'); S.color = P().palette.length - 1; changed(true); toast('Color added: edit it with the color box'); };
$('delColor').onclick = () => { if (S.color < 0) return; const c = S.color;
  const used = P().poses.some((po) => po.frames.some((f) => f.includes(c)));
  if (used) { toast('That color is used in a frame. Recolor those pixels first.'); return; }
  pushUndo(); P().palette.splice(c, 1); for (const po of P().poses) for (const f of po.frames) for (let i = 0; i < f.length; i++) if (f[i] > c) f[i]--;
  S.color = Math.min(c, P().palette.length - 1); changed(true); };
$('presets').onchange = () => { const k = $('presets').value; $('presets').value = ''; if (!k) return; pushUndo(); let n = 0;
  for (const h of PRESETS[k]) if (!P().palette.includes(h) && P().palette.length < MAX_COLORS) { P().palette.push(h); n++; }
  changed(true); toast(n ? `Added ${n} colors` : 'Those colors are already in the palette'); };
$('fps').oninput = () => { curPose().fps = +$('fps').value; $('fpsVal').textContent = curPose().fps + ' fps'; S.dirty = true; scheduleSave(); };
$('playBtn').onclick = () => { playing = !playing; $('playBtn').textContent = playing ? 'Pause' : 'Play'; };

window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || $('modal').classList.contains('open')) return;
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'y') { e.preventDefault(); redo(); return; }
  if (mod && k === 'c') { e.preventDefault(); copy(false); return; }
  if (mod && k === 'x') { e.preventDefault(); copy(true); return; }
  if (mod && k === 'v') { e.preventDefault(); paste(); return; }
  if (mod && k === 'a') { e.preventDefault(); $('selAllBtn').click(); return; }
  if (mod) return;
  const tools = { b: 'pencil', p: 'pencil', e: 'eraser', g: 'fill', i: 'picker', l: 'line', r: 'rect', c: 'replace', m: 'select', h: 'hand' };
  if (tools[k]) { setTool(tools[k]); return; }
  if (k === ' ') { spaceHand = true; e.preventDefault(); return; }
  if (k === 'enter') { commitFloat(); S.sel = null; changed(false); }
  if (k === 'escape') { commitFloat(); S.sel = null; changed(false); }
  if (k === 'delete' || k === 'backspace') transform('clear');
  const arrows = { arrowleft: 'L', arrowright: 'R', arrowup: 'U', arrowdown: 'D' };
  if (arrows[k]) { e.preventDefault(); transform(arrows[k]); }
  if (k === 'x') $('flipH').click();
  if (k === ',' ) { S.frame = Math.max(0, S.frame - 1); changed(false); }
  if (k === '.') { S.frame = Math.min(curPose().frames.length - 1, S.frame + 1); changed(false); }
});
window.addEventListener('keyup', (e) => { if (e.key === ' ') spaceHand = false; });
window.addEventListener('resize', () => render());
// Closing or hiding the page: the device copy is written synchronously, the cloud copy is attempted.
window.addEventListener('pagehide', () => { if (S.dirty) { writeLocal(true); save(); } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && S.dirty) { writeLocal(true); save(); } });
window.addEventListener('online', () => { if (S.dirty) save(); });

// ------------------------------------------------------------------ starter designs
// New designs shipped with the game (seeds/*.json) are added once to the
// project list, so they can be opened and edited like any other project.
// Deleting one later does not bring it back.
const SEEDS = { 'croc-hatchling': 3, 'croc-juvenile': 3, 'croc-adult': 3,
  'fish-blue_tang': 3, 'fish-reef_snapper': 3, 'fish-red_grouper': 3, 'fish-grey_shark': 3,
  'mosa-hatchling': 4, 'mosa-juvenile': 3, 'mosa-adult': 3,
  'white_shark-hatchling': 3, 'white_shark-juvenile': 3, 'white_shark-adult': 3,
  'fang-hatchling': 3, 'fang-juvenile': 3, 'fang-adult': 3,
  'crab-checkpoint': 3, 'fish-lionfish': 3, 'fish-moray_eel': 3, 'fish-barracuda': 3,
  'fish-archerfish': 3, 'fish-polar_cod': 3, 'fish-anglerfish': 3, 'fish-bull_shark': 3, 'fish-leopard_seal': 3,
  'fish-great_white': 3, 'fish-sperm_whale': 3,
  'beast-box_jelly': 3, 'beast-sea_snake': 3, 'beast-giant_octopus': 3, 'beast-giant_squid': 3, 'beast-orca': 3,
  'fish-lanternfish': 3, 'fish-viperfish': 3, 'beast-gulper_eel': 3, 'beast-vampire_squid': 3, 'beast-electric_eel': 3,
  'fish-flying_fish': 3, 'fish-sargassum_fish': 3, 'fish-mahi_mahi': 3, 'fish-yellowfin_tuna': 3, 'fish-sailfish': 3, 'beast-green_turtle': 3, 'beast-man_o_war': 3,
  'fish-garibaldi': 3, 'fish-sheephead': 3, 'beast-sea_urchin': 3, 'beast-sea_otter': 3, 'beast-sea_lion': 3 };   // id -> design version
// Every starter design ships with one of these timestamps; saving any change replaces it.
const SEED_STAMPS = ['2026-11-21T08:45:00.000Z', '2026-11-21T09:30:00.000Z', '2026-11-21T11:30:00.000Z', '2026-11-21T12:00:00.000Z'];
async function seedStarters() {
  let done = {};
  try { const v = JSON.parse(localStorage.getItem('spritestudio.seeded') || '{}'); done = Array.isArray(v) ? Object.fromEntries(v.map((id) => [id, 1])) : v; } catch {}
  if (db) { try { const m = await db.doc('meta/seeds').get(); if (m.exists) { const d = m.data();
    if (d.versions) for (const [k, v] of Object.entries(d.versions)) done[k] = Math.max(done[k] || 0, v);
    else (d.ids || []).forEach((id) => { done[id] = Math.max(done[id] || 0, 1); }); } } catch {} }
  let changedAny = false;
  for (const [id, ver] of Object.entries(SEEDS)) {
    if ((done[id] || 0) >= ver) continue;
    try {
      const res = await fetch('seeds/' + id + '.json'); if (!res.ok) continue;
      const data = await res.json();
      let existing = readLocal(id);
      if (db) { try { const d = await db.doc('projects/' + id).get(); if (d.exists) existing = d.data(); } catch {} }
      // Never overwrite someone's drawing: an edited older design stays, and the new one arrives as a copy.
      // Untouched = an older starter design nobody saved changes to.
      const untouched = existing && SEED_STAMPS.includes(existing.updatedAt) && (existing.seedVersion || 1) < ver;
      const target = !existing || untouched ? id : id + '-v' + ver;
      const body = { ...data, name: target === id ? data.name : data.name + ' (new design)', rev: (existing && target === id ? (existing.rev || 0) : 0) + 1, device: DEVICE };
      if (db) await db.doc('projects/' + target).set(body);
      try { localStorage.setItem(LOCAL + target, JSON.stringify({ ...body, pending: !db })); } catch {}
      done[id] = ver; changedAny = true;
    } catch {}
  }
  try { localStorage.setItem('spritestudio.seeded', JSON.stringify(done)); } catch {}
  if (db && changedAny) { try { await db.doc('meta/seeds').set({ versions: done }); } catch {} }
}

// ------------------------------------------------------------------ boot
async function boot() {
  // Show a working canvas right away; cloud storage lights up when ready.
  S.project = newProject('My character', 48, 24); S.id = null; fitZoom(); changed(false);
  requestAnimationFrame(previewTick);
  const cap = (name) => (window.claude && window.claude.use ? Promise.race([window.claude.use(name), new Promise((r) => setTimeout(() => r(null), 10000))]).catch(() => null) : Promise.resolve(null));
  [db, downloads] = await Promise.all([cap('db'), cap('downloads')]);
  let last = null; try { last = localStorage.getItem('spritestudio:last'); } catch {}
  const qs = new URLSearchParams(location.search);
  const want = qs.get('project');
  // Starter designs first: a link like ?project=croc-hatchling must open that drawing even on a
  // device that has never opened the studio (and get its newest shipped version).
  await seedStarters();
  if (want && await loadProject(want)) {
    const pose = Math.min(P().poses.length - 1, Math.max(0, parseInt(qs.get('pose') || '0', 10) || 0));
    S.pose = pose; S.frame = 0; changed(false);
    try { history.replaceState(null, '', location.pathname); } catch {}
    return;
  }
  if (want) toast('That drawing was not found, so your last project is open.');
  const list = await listProjects();
  const pick = (last && list.find((p) => p.id === last)) || list.find((p) => p.id === 'croc') || list[0];
  if (pick && await loadProject(pick.id)) return;
  startNew('My character', 48, 24);
  setSave(db ? 'New project' : 'Saved on this device');
}
boot();
})();
