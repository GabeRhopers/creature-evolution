# Runs on every pull request. The "test" job is the required check for auto-merge:
# a pull request merges itself only when it passes.
name: Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Atlas build, type check, every unit test, then the production build.
      - run: npm run build

  # Plays the real build in headless Chrome. The suites run in three parallel shards (one long job
  # ran past its time limit as the game grew); the "browser" job below sums them up under one name.
  browser-shard:
    name: browser (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: saves and heroes
            suites: stages framework roundtrip save_e2e perks slots mosa shark studio_save sargasso fang elder skins spino
          - shard: creatures and fights
            suites: crab enemies creatures tides stomach areas enemy_settings hud spawn_factors trench crowd kelp
          - shard: world and controls
            suites: gamepad pad_map studio_game studio_restore terrain daynight world music land gates region_twists boss offline perf coach playlog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Browser tests
        env:
          SUITES: ${{ matrix.suites }}
        run: |
          set -o pipefail
          # The suites save screenshots here; without the folders they stop early.
          sudo mkdir -p /home/claude/stages /home/claude/tools && sudo chmod 777 /home/claude/stages /home/claude/tools
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 60); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          fail=0
          for t in $SUITES; do
            echo "::group::$t"
            node tests/e2e/$t.mjs | tee /tmp/$t.log || fail=1
            grep -q '^FAIL' /tmp/$t.log && fail=1
            echo "::endgroup::"
          done
          exit $fail

  browser:
    name: browser
    needs: browser-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Shards: ${{ needs.browser-shard.result }}"
          test "${{ needs.browser-shard.result }}" = "success"
